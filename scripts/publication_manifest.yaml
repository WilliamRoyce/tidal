# Publication artefact manifest.
#
# Maps each manuscript figure/table to its producing script(s), data
# dependencies, and appendix reference. Read by:
#   - tests/publication/* (validates round-trip script -> data -> output)
#   - scripts/run_benchmarks.sh (enumerates benchmark jobs)
#
# Each entry under appendix_<X> is keyed by the artefact's manuscript label.
# `kind` is one of: figure, table, static_tikz.
# `appendix_ref` is the source-line citation pointing at the TODO this
# artefact satisfies.

appendix_C:

  figC1_solver_convergence:
    kind: figure
    figure_script: scripts/figures/figC1_solver_convergence.py
    benchmark_script: scripts/benchmarks/solver_convergence.py
    canonical_data: benchmark_results/canonical/solver_convergence.json
    output: manuscript/figures/figC1_solver_convergence.pdf
    appendix_ref: manuscript/sections/appendices/numerical.tex:547

