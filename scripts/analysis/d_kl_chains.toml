# Inventory of every surveyed PolyChord chain that feeds the §4 D_KL
# parameter-importance analysis.  scripts/analysis/recompute_parameter_kl.py
# walks this list and emits parameter_importance.json into each chain
# subdirectory.  scripts/analysis/extract_d_kl.py reads the emitted JSONs
# to produce the §4 / App J TeX fragments.
#
# Add new chains (e.g. forthcoming localized-geometry runs) by appending
# [[chain]] tables here — no code changes needed.
#
# Schema per entry:
#   theory      — short name used to key the per-theory listings
#   geometry    — plane_wave | dual_gaussian | wavepacket (future)
#   jobid       — HPC SLURM job id (numeric string)
#   amp_path    — relative path to amp PolyChord subdir
#   sup_path    — relative path to sup PolyChord subdir
#   param_names — ordered list of parameter labels matching the chain columns
#
# Priors are read from <amp_path>/inference.json when available. Chains that
# pre-date the inference.json schema get an all-arctan_uniform(-89,89)
# fallback; where that is wrong for specific parameters, supply
#   prior_overrides = { name = "DIST:LO:HI", ... }
# using the same syntax as the campaign --prior flags (provenance:
# scripts/hpc_templates/*.sbatch). Names refer to param_names (i.e. the
# relabeled column names, matched positionally to the recorded priors).

[[chain]]
theory = "dark_photon_plasma"
geometry = "plane_wave"
jobid = "29205968+29205982"
amp_path = "hpc_results/29205968/stage_a_amp_v3_pub"
sup_path = "hpc_results/29205982/stage_a_sup_v3_pub"
param_names = ["mA2", "deltam", "xi", "alpha3"]

[[chain]]
