repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Prevent giant files from being committed
      - id: check-added-large-files
        args: [--maxkb=1000]
        # The frozen legacy oracle (GH #525) copies two derived specs that exceed
        # the cap -- 1.0 and 1.6 MB. They are byte-for-byte copies of files
        # already tracked under examples/data/, so the cap would reject a
        # duplicate of something the repo already carries.
        exclude: ^tests_cosmo/data/oracles/(specs|inspect|validate)/|^tests_cosmo/data/oracles/manifest\.json$|^scripts/psalter/resources/.*\.nb$
      # Check for files that would conflict in case-insensitive filesystems
      - id: check-case-conflict
      # Check for merge conflicts
      - id: check-merge-conflict
      # Check YAML files for parseable syntax
      - id: check-yaml
        # Cobaya input files use Cobaya's own !defaults tag, which a generic loader rejects (R-1 #566)
        exclude: ^(\.github/workflows/|scripts/research/interfaces/(theories|runs)/)
      # Check TOML files for parseable syntax
      - id: check-toml
      # Ensure files end in a newline
      # The oracle's generated subtrees join outputs/ here for a sharper reason: 45 of
      # its 46 spec copies are byte-for-byte copies of committed files that have
      # no trailing newline. Appending one would make the copy differ from its
      # source, and the freeze script would rewrite it on the next run -- a
      # byte-for-byte gate (GH #525) that can never be clean. Scoped to the
      # generated subtrees, so the hand-written README stays fixed up.
      - id: end-of-file-fixer
        exclude: ^(outputs/|tests_cosmo/data/oracles/(specs|inspect|validate)/|^tests_cosmo/data/oracles/manifest\.json$|^scripts/psalter/resources/.*\.nb$)
      # Remove trailing whitespace
      - id: trailing-whitespace
        exclude: ^(outputs/|tests_cosmo/data/oracles/(specs|inspect|validate)/|^tests_cosmo/data/oracles/manifest\.json$|^scripts/psalter/resources/.*\.nb$)
      # Check Python syntax
      - id: check-ast
      # Check for debugger imports
      - id: debug-statements

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports, --no-strict-optional]
        # tidalcosmo/ and tests_cosmo/ are excluded on purpose: repo_reshape.md section 8
        # makes *pyright strict* the type gate for the new tree, and pyrightconfig.json
        # already covers both.  Running a second checker there with different settings and a
        # different opinion buys nothing and guarantees a future argument about which verdict
        # counts.  (Added I-REM, 2026-09-09.)
        exclude: ^(tests/|examples/|tidalcosmo/|tests_cosmo/)

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
