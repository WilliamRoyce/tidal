[project]
name = "tidal"
version = "0.11.0"
description = "TIDAL: Tensor Integration and Derivation for Any Lagrangian"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "William Royce" }]
keywords = [
    "physics",
    "pde",
    "simulation",
    "gravitational-waves",
    "electromagnetic-waves",
    "numerical-methods",
    "tensor-calculus",
    "differential-geometry",
    "general-relativity",
    "torsion",
    "gertsenshtein",
    "symbolic-computation",
    "xact",
    "wolfram",
    "field-theory",
    "lagrangian",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Other",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.1,<4.0",
    "numpy>=1.22,<3.0",
    "scipy>=1.10,<2.0",
    "scikit-sundae>=1.1.2,<2.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
wolfram = ["wolframclient>=1.4.0,<2.0"]
sensitivity = ["SALib>=1.4"]
completion = ["shtab>=1.5"]
color = ["rich-argparse>=1.4"]

[project.scripts]
tidal = "tidal.cli:main"

[project.urls]
Homepage = "https://github.com/WilliamRoyce/torsion-gertsenshtein"
Documentation = "https://williamroyce.github.io/torsion-gertsenshtein/"
Repository = "https://github.com/WilliamRoyce/torsion-gertsenshtein"
Issues = "https://github.com/WilliamRoyce/torsion-gertsenshtein/issues"
Changelog = "https://github.com/WilliamRoyce/torsion-gertsenshtein/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff",
    "pytest >=8.3.3,<9.0.0",
    "pytest-cov >=6.0.0,<7.0.0",
    "pyright ==1.1.403",
    "sphinx >=8.1.3,<9.0.0",
    "pydata-sphinx-theme >=0.16.0,<0.17.0",
    "myst-parser >=4.0.0,<5.0.0",
    "ruamel.yaml >=0.18.0,<0.19.0",
]


[tool.ruff]
unsafe-fixes = true
exclude = [".git", ".git-rewrite", ".vscode"]

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
    "COM812",
    "E501",
    "S101",
    "PT009",
    "D100",
    "D105",
    "CPY001",
    "TD003",
    "TD002",
    "DOC201",
    "DOC402",
    "PD",
]
fixable = ["ALL"]
unfixable = ["T201"]


[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*" = [
    "PLR6301",
    "PLR0914",
    "D101",
    "D102",
    "D103",
    "D104",
    "D205",
    "SLF001",
    "PLC0415",
    "PLC2701",
    "PLR0904",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "FBT001",
    "N806",
    "RUF003",
    "S108",
    "S404",
    "S603",
    "ARG002",
]
"examples/**/*" = ["INP001", "T201", "E402", "PLR0913", "PLR0917"]
"tidal/cli/**/*" = ["T201", "PLC0415"]
"tidal/cli/_derive.py" = ["T201", "PLC0415", "S404", "S603", "S607"]
"scripts/**/*" = [
    "INP001",
    "T201",
    "D101",
    "D102",
    "D103",
    "D104",
    "S607",
    "S603",
]
"docs/**/*" = ["INP001", "I002"]

[tool.ruff.lint.pylint]
allow-dunder-method-names = [
    "__as_fundamental__",
    "__from_fundamental__",
    "__into_fundamental__",
    "__as_transformed__",
    "__into_transformed__",
    "__from_transformed__",
    "__convert_vector_into__",
    "__into_inner__",
    "__from_inner__",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["tidal"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.package-data]
tidal = ["py.typed", "wolfram/*.wl"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tidal*"]
exclude = ["outputs*", "tests*", "docs*"]
