[project]
name = "torsion_gertsenshtein"
version = "0.1.0"
description = "Linearized PDE simulations for electromagnetic-gravitational wave conversion research"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "William Royce" }]
keywords = [
    "physics",
    "pde",
    "simulation",
    "gravitational-waves",
    "electromagnetic-waves",
    "numerical-methods",
    "tensor-calculus",
    "differential-geometry",
    "general-relativity",
    "torsion",
    "gertsenshtein",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "py-pde>=0.38,<1.0",
    "matplotlib>=3.1,<4.0",
    "numba>=0.59,<1.0",
    "numpy>=1.22,<3.0",
    "scipy>=1.10,<2.0",
    "sympy>=1.9,<2.0",
    "tqdm>=4.66,<5.0",
    "wolframclient>=1.4.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/WilliamRoyce/torsion-gertsenshtein"
Documentation = "https://williamroyce.github.io/torsion-gertsenshtein/"
Repository = "https://github.com/WilliamRoyce/torsion-gertsenshtein"
Changelog = "https://github.com/WilliamRoyce/torsion-gertsenshtein/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff",
    "pytest >=8.3.3,<9.0.0",
    "pytest-cov >=6.0.0,<7.0.0",
    "pyright ==1.1.403",
    "sphinx >=8.1.3,<9.0.0",
    "pydata-sphinx-theme >=0.16.0,<0.17.0",
]


[tool.ruff]
unsafe-fixes = true
exclude = [".git", ".git-rewrite", ".vscode"]

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
    "COM812",
    "E501",
    "S101",
    "PT009",
    "D100",
    "D105",
    "CPY001",
    "TD003",
    "TD002",
    "DOC201",
    "DOC402",
    "PD",
]
fixable = ["ALL"]
unfixable = ["T201"]


[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*" = ["PLR6301", "PLR0914", "D101", "D102", "D103", "D104", "D205"]
"examples/**/*" = ["INP001", "T201", "E402"]
"scripts/**/*" = ["INP001", "T201", "D101", "D102", "D103", "D104"]
"docs/**/*" = ["INP001", "I002"]
"torsion_gertsenshtein/kgsim/animation_builder.py" = [
    "EXE002",
] # Container permission issue

[tool.ruff.lint.pylint]
allow-dunder-method-names = [
    "__as_fundamental__",
    "__from_fundamental__",
    "__into_fundamental__",
    "__as_transformed__",
    "__into_transformed__",
    "__from_transformed__",
    "__convert_vector_into__",
    "__into_inner__",
    "__from_inner__",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["torsion_gertsenshtein"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[tool.pyright]
typeCheckingMode = "strict"
include = ["tests", "torsion_gertsenshtein", "examples"]
reportImplicitOverride = true
reportUnknownMemberType = false

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["torsion_gertsenshtein*"]
exclude = ["outputs*", "tests*", "docs*"]
