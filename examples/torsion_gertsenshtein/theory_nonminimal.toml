# Torsion-Gertsenshtein with Non-Minimal Coupling: δ₁ R̃_{[μν]} F^{μν}
#
# Lagrangian:
#   L = (1/κ²) R̃ + α₁I₁ + α₂I₂ + α₃I₃ + δ₁ R̃_{[μν]} F^{μν} − ¼F²
#
# Independent torsion mass parameters compensate R̃ tensor/axial tachyons.
#
# This is the simplest quadratic non-minimal torsion-EM coupling from the
# general PGT+EM enumeration (research/general_quadratic_lagrangian.tex,
# §3.2.4, eq. 3.7).
#
# Key physics:
#   - R̃_{[μν]} (antisymmetric Ricci) vanishes identically without torsion
#     → δ₁ term is a pure torsion signal
#   - NO b5 R̃² → no Ostrogradsky ghosts, no 4th-order time derivatives
#   - Torsion is non-propagating (algebraically constrained by mass term α)
#   - The background B-field sources torsion algebraically through δ₁:
#       (α mass) × t = -δ₁ × f(h, a, F̄)
#       → t = -(δ₁/α) × coupling terms
#   - This algebraic torsion feeds back into the photon EOM,
#     modifying the effective Gertsenshtein coupling:
#       κ_eff = κ × (1 + g(δ₁, α))
#   - If |κ_eff| > |κ|: torsion amplifies the Gertsenshtein effect
#
# Ghost status: SAFE (Yang-Mills type, R̃ × F ~ O(∂¹Γ)×O(∂¹A))
#
# The δ₁ R̃_{[μν]} F^{μν} term in xAct:
#   RicciCDT[-a,-b] contracted with F[-c,-d] via η.
#   F is antisymmetric → only the antisymmetric part of RicciCDT contributes.
#   RicciCDT[-a,-b] = RicciCD[-a,-b] + (torsion-dependent terms)
#   where the torsion-dependent part ∝ ∇K + K² (contortion).
#
# Refs:
#   Shapiro (2002), hep-th/0103093, §6 — non-minimal coupling enumeration
#   Barker (2024), arXiv:2406.12826 — PGT particle spectra
#   research/general_quadratic_lagrangian.tex — complete enumeration
#   Issues: #154, #199, #200

[theory]
name = "Torsion-Gertsenshtein Non-Minimal (δ₁ R̃[μν]F)"
description = "PGT + EM with non-minimal δ₁ R̃_{[μν]} F^{μν} coupling, no R̃²"

[spacetime]
dimension = 4
metric = "minkowski"

[torsion]
perturbation_name = "t"

# Metric perturbation h_{ab} (graviton, rank-2 symmetric)
[[fields]]
name = "h"
type = "tensor"
rank = 2
symmetry = "symmetric"

# Full EM 4-potential (fundamental field for perturbation)
[[fields]]
name = "A"
type = "vector"

# EM perturbation (photon)
[[fields]]
name = "a"
type = "vector"

# Electromagnetic field strength tensor F = dA
[[derived_fields]]
name = "F"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][A[-b]] - CD[-b][A[-a]]"

# Background EM 4-potential: Abar_y = -B0*z → B_x = B0
[[background_fields]]
name = "Abar"
type = "vector"
components = ["0", "0", "-B0 * z[]", "0"]

[constants]
names = ["kappa", "B0", "alpha1", "alpha2", "alpha3", "delta1"]

# Lagrangian: (1/κ²)R̃ + α₁I₁ + α₂I₂ + α₃I₃ + δ₁ R̃_{[μν]}F^{μν} - ¼F²
#
# Independent torsion mass parameters (α₁, α₂, α₃) for each invariant:
#   I₁ = T_{λμν} T^{λμν}     (tensor-dominated)
#   I₂ = T_{λμν} T^{μλν}     (index-permuted)
#   I₃ = T_μ T^μ              (trace)
#
# Stability conditions (all sectors Proca-like, negative mass in Lagrangian):
#   R̃ gives: trace -(4/3)/κ², tensor +(1/2)/κ², axial +(1/24)/κ²
#   Irreducible projections:
#     tensor q²: (1/2)/κ² + (α₁+α₂)      < 0  →  α₁+α₂ < -1/(2κ²)
#     axial  S²: (1/24)/κ² - (1/6)(α₁-α₂) < 0  →  α₁-α₂ > 1/(4κ²)
#     trace  T²: -(4/3)/κ² + α₃ + (1/3)(2α₁+α₂) < 0
#   At (α₁=0, α₂=-0.6, α₃=0.5, κ=1): tensor=-0.1, axial=-0.058, trace=-1.033 (ALL STABLE)
#
# Note: NO b5 R̃² term (avoids Ostrogradsky ghosts)
# Note: RicciCDT[-a,-b] * F[-c,-d] — antisymmetric projection is automatic
[lagrangian]
expression = "((1/kappa^2) RicciScalarCDT[] + alpha1 TorsionCDT[-a,-b,-c] eta[a,d] eta[b,e] eta[c,f] TorsionCDT[-d,-e,-f] + alpha2 TorsionCDT[-a,-b,-c] eta[b,d] eta[a,e] eta[c,f] TorsionCDT[-d,-e,-f] + alpha3 TorsionCDT[b,-b,-a] eta[a,d] TorsionCDT[c,-c,-d] + delta1 RicciCDT[-a,-b] eta[a,c] eta[b,d] F[-c,-d] - 1/4 F[-a,-b] eta[a,c] eta[b,d] F[-c,-d])"

[linearization]
perturbation_field = "h"

[[linearization.matter_perturbations]]
field = "A"
perturbation_name = "a"
background = "Abar"

# NO TT gauge on h — torsion coupling may modify all graviton channels.
# The h↔a Gertsenshtein coupling is extracted by Component E-L after
# background field derivatives are evaluated to B₀ components.
# Lorenz gauge on photon a only
[[gauge]]
field = "a"
type = "lorenz"

# Plane-wave reduction: propagation along z-axis
[reduction]
type = "plane_wave"
propagation_axis = "z"

# Default parameters (all-sector stable at κ=1):
# kappa = 1.0 (gravitational coupling)
# B0 = 0.01 (small-P regime for C₀ measurement)
# alpha1 = 0 (I₁ mass: tensor-dominated)
# alpha2 = -0.6 (I₂ mass: compensates R̃ tensor tachyon)
# alpha3 = 0.5 (I₃ mass: trace sector)
# delta1 = 0.1 (non-minimal R̃[μν]F coupling)

[output]
path = "../data/torsion_gertsenshtein_nonminimal.json"
