# Propagating Nonminimal Torsion: δ₁R̃[μν]F + ξFtorsion² + α₁I₁+α₂I₂+α₃I₃
#
# Lagrangian:
#   L = (1/κ²) R̃ + α₁I₁ + α₂I₂ + α₃I₃ − (ξ/4)Ftorsion² + δ₁R̃[μν]F^μν − ¼F²
#
# Combines three mechanisms:
#   1. Independent torsion masses (α₁,α₂,α₃) for all-sector stability
#   2. Torsion trace kinetics (ξFtorsion²) — trace propagates, prevents
#      constraint elimination that destabilized the algebraic model (#231)
#   3. Nonminimal R̃[μν]F coupling — direct torsion-EM interaction through
#      the antisymmetric Ricci tensor (beyond kinetic mixing)
#
# Stability (all sectors Proca-like at α₁=0, α₂=-0.6, α₃=0.5, κ=1):
#   Tensor: (1/2)/κ² + (α₁+α₂) = -0.1   ✓
#   Axial:  (1/24)/κ² - (1/6)(α₁-α₂) = -0.058  ✓
#   Trace:  -(4/3)/κ² + α₃ + (1/3)(2α₁+α₂) = -1.033  ✓
#
# Physics:
#   - R̃[μν]F trace part = kinetic mixing F·Ftorsion (zero amplification alone)
#   - R̃[μν]F tensor/axial parts = beyond-trace coupling (may amplify)
#   - With all sectors stable: no tachyonic instability from beyond-trace
#   - Active Gertsenshtein channel: h_5 ↔ a_1 (h× graviton ↔ x-photon)
#
# Refs:
#   Shapiro (2002), hep-th/0103093 — R̃ decomposition, non-minimal coupling
#   Barker (2024), arXiv:2406.12826 — eWGT, dark photon analogy
#   research/general_quadratic_lagrangian.tex — complete PGT+EM enumeration

[theory]
name = "Propagating Nonminimal Torsion (R̃[μν]F + Ftorsion²)"
description = "PGT + EM with propagating torsion, nonminimal R̃[μν]F coupling, all-sector stable mass"

[spacetime]
dimension = 4
metric = "minkowski"

[torsion]
perturbation_name = "t"

# Metric perturbation h_{ab} (graviton, rank-2 symmetric)
[[fields]]
name = "h"
type = "tensor"
rank = 2
symmetry = "symmetric"

# Full EM 4-potential (fundamental field for perturbation)
[[fields]]
name = "A"
type = "vector"

# EM perturbation (photon)
[[fields]]
name = "a"
type = "vector"

# Electromagnetic field strength tensor F = dA
[[derived_fields]]
name = "F"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][A[-b]] - CD[-b][A[-a]]"

# Torsion trace field strength: Ftorsion_{ab} = ∂_a T_b - ∂_b T_a
[[derived_fields]]
name = "Ftorsion"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][TorsionCDT[c,-c,-b]] - CD[-b][TorsionCDT[c,-c,-a]]"

# Background EM 4-potential: Abar_y = -B0*z → B_x = B0
[[background_fields]]
name = "Abar"
type = "vector"
components = ["0", "0", "-B0 * z[]", "0"]

[constants]
names = ["kappa", "B0", "alpha1", "alpha2", "alpha3", "xi", "delta1"]

# Lagrangian:
#   (1/κ²)R̃ + α₁I₁ + α₂I₂ + α₃I₃ - (ξ/4)Ftorsion² + δ₁R̃[μν]F - ¼F²
#
# Terms:
#   1. (1/κ²)R̃ — Einstein-Cartan gravity
#   2. α₁I₁ — tensor-dominated torsion mass (T_{λμν}T^{λμν})
#   3. α₂I₂ — index-permuted torsion mass (T_{λμν}T^{μλν})
#   4. α₃I₃ — trace torsion mass (T^a_{ab}T^{cb}_{c})
#   5. -(ξ/4)Ftorsion² — torsion trace kinetics (Yang-Mills for T_μ)
#   6. δ₁R̃[μν]F — nonminimal torsion-EM coupling
#   7. -¼F² — Maxwell
[lagrangian]
expression = "((1/kappa^2) RicciScalarCDT[] + alpha1 TorsionCDT[-a,-b,-c] eta[a,d] eta[b,e] eta[c,f] TorsionCDT[-d,-e,-f] + alpha2 TorsionCDT[-a,-b,-c] eta[b,d] eta[a,e] eta[c,f] TorsionCDT[-d,-e,-f] + alpha3 TorsionCDT[b,-b,-a] eta[a,d] TorsionCDT[c,-c,-d] - 1/4 xi Ftorsion[-a,-b] eta[a,c] eta[b,d] Ftorsion[-c,-d] + delta1 RicciCDT[-a,-b] eta[a,c] eta[b,d] F[-c,-d] - 1/4 F[-a,-b] eta[a,c] eta[b,d] F[-c,-d])"

[linearization]
perturbation_field = "h"

[[linearization.matter_perturbations]]
field = "A"
perturbation_name = "a"
background = "Abar"

# Lorenz gauge on photon a only
[[gauge]]
field = "a"
type = "lorenz"

# Plane-wave reduction: propagation along z-axis
[reduction]
type = "plane_wave"
propagation_axis = "z"

# Default parameters (all-sector stable)
[parameters]
kappa = 1.0
B0 = 0.01
alpha1 = 0
alpha2 = -0.6
alpha3 = 0.5
xi = 0.1
delta1 = 0.1

[output]
path = "../data/torsion_gertsenshtein_propagating.json"
