# Minimal PGT with Propagating Torsion (Barker's Maxwell Torsion)
#
# Lagrangian:
#   L = (1/κ²) R̃ + β₁I₁ + β₂I₂ + β₃I₃ − (ξ/4)Ftorsion² − ¼F²
#
# This is the standard quadratic PGT + Maxwell with Barker's ghost-free
# torsion kinetic term (arXiv:2406.12826). NO curvature-squared terms,
# NO nonminimal torsion-EM cross-coupling.
#
# The Ftorsion² term (-(ξ/4)∂_{[μ}T_{ν]}∂^{[μ}T^{ν]}) gives the torsion
# trace T_μ a Yang-Mills kinetic term, enabling propagation as a massive
# vector ("dark photon"). Ghost-free by construction (2nd-order in torsion).
#
# Physics prediction:
#   The h_×↔a_x Gertsenshtein channel is COMPLETELY DECOUPLED from torsion
#   (block-diagonal structure). The conversion probability P = sin²(κB₀t/2)
#   is independent of ALL torsion parameters (β₁, β₂, β₃, ξ).
#   This is the NULL RESULT: minimal PGT does not modify the Gertsenshtein effect.
#
# The null result holds because:
#   - Ftorsion² only gives dynamics to the trace sector (T_μ)
#   - The h_× graviton (TT polarisation) is algebraically independent of T_μ
#   - No term in the Lagrangian couples the h_× channel to torsion
#   - Breaking this decoupling requires beyond-minimal terms: δ₁R̃_{[μν]}F^{μν},
#     cubic T²F, or derivative ζ∇T·F couplings
#
# Refs:
#   Barker (2024), arXiv:2406.12826 — eWGT embedding, Maxwell torsion motivation
#   Blagojević & Cvetković (2018), arXiv:1812.02675 — ghost-free PGT classification
#   Obukhov & Trukhanova (2024), arXiv:2410.01355 — spin-torsion coupling suppression
#   research/general_quadratic_lagrangian.tex — complete PGT+EM enumeration
#
# Derivation timing: ~15-20m wall (to be verified)

[theory]
name = "Minimal PGT + Propagating Torsion (Barker)"
description = "Standard quadratic PGT + Maxwell with ghost-free torsion kinetics, no nonminimal coupling"

[spacetime]
dimension = 4
metric = "minkowski"

[torsion]
perturbation_name = "t"

# Metric perturbation h_{ab} (graviton, rank-2 symmetric)
[[fields]]
name = "h"
type = "tensor"
rank = 2
symmetry = "symmetric"

# Full EM 4-potential (fundamental field for perturbation)
[[fields]]
name = "A"
type = "vector"

# EM perturbation (photon)
[[fields]]
name = "a"
type = "vector"

# Electromagnetic field strength tensor F = dA
[[derived_fields]]
name = "F"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][A[-b]] - CD[-b][A[-a]]"

# Torsion trace field strength: Ftorsion_{ab} = ∂_a T_b - ∂_b T_a
# where T_a = T^c_{ca} is the torsion trace vector (Barker's notation)
[[derived_fields]]
name = "Ftorsion"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][TorsionCDT[c,-c,-b]] - CD[-b][TorsionCDT[c,-c,-a]]"

# Background EM 4-potential: Abar_y = -B0*z → B_x = B0
[[background_fields]]
name = "Abar"
type = "vector"
components = ["0", "0", "-B0 * z[]", "0"]

[constants]
names = ["kappa", "B0", "beta1", "beta2", "beta3", "xi"]

# Lagrangian:
#   (1/κ²)R̃ + β₁I₁ + β₂I₂ + β₃I₃ - (ξ/4)Ftorsion² - ¼F²
#
# Terms:
#   1. (1/κ²)R̃ — Einstein-Cartan gravity (Ricci scalar with torsion)
#   2. β₁I₁ — tensor torsion mass (T_{λμν}T^{λμν})
#   3. β₂I₂ — index-permuted torsion mass (T_{λμν}T^{μλν})
#   4. β₃I₃ — trace torsion mass (T_μ T^μ)
#   5. -(ξ/4)Ftorsion² — torsion trace kinetics (Barker's Maxwell term)
#   6. -¼F² — standard Maxwell electromagnetism
#
# NO δ₁R̃_{[μν]}F^{μν} — no nonminimal torsion-EM cross-coupling
[lagrangian]
expression = "((1/kappa^2) RicciScalarCDT[] + beta1 TorsionCDT[-a,-b,-c] eta[a,d] eta[b,e] eta[c,f] TorsionCDT[-d,-e,-f] + beta2 TorsionCDT[-a,-b,-c] eta[b,d] eta[a,e] eta[c,f] TorsionCDT[-d,-e,-f] + beta3 TorsionCDT[b,-b,-a] eta[a,d] TorsionCDT[c,-c,-d] - 1/4 xi Ftorsion[-a,-b] eta[a,c] eta[b,d] Ftorsion[-c,-d] - 1/4 F[-a,-b] eta[a,c] eta[b,d] F[-c,-d])"

[linearization]
perturbation_field = "h"

[[linearization.matter_perturbations]]
field = "A"
perturbation_name = "a"
background = "Abar"

# Lorenz gauge on photon a only (no gauge on h — torsion may couple to all graviton channels)
[[gauge]]
field = "a"
type = "lorenz"

# Plane-wave reduction: propagation along z-axis
[reduction]
type = "plane_wave"
propagation_axis = "z"

# Default parameters:
# kappa = 1.0 (gravitational coupling)
# B0 = 0.0001 (small background for linear regime)
# beta1 = 0.5, beta2 = 0.3, beta3 = 0.2 (torsion masses)
# xi = 1.0 (torsion kinetics)

[output]
path = "../data/torsion_gertsenshtein_minimal_propagating.json"
