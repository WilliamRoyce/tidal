[theory]
name = "Electromagnetism"
description = "Maxwell's equations in 2+1D — plane-wave propagation"

[spacetime]
dimension = 3
metric = "minkowski"

[[fields]]
name = "A"
type = "vector"

[[derived_fields]]
name = "F"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][A[-b]] - CD[-b][A[-a]]"

[lagrangian]
# L = -1/4 F_ab F^ab (field strength expanded via derived_fields substitution)
expression = "-1/4 F[-a, -b] eta[a, c] eta[b, d] F[-c, -d]"

[constraint_solver]
enabled = true
method = "auto"

[constraint_solver.boundary_conditions.x]
type = "periodic"

[constraint_solver.boundary_conditions.y]
type = "periodic"

[output]
path = "../data/em_3d.json"
