[theory]
name = "Scalar-Vector Coupling"
description = "Stress test: scalar + vector cross-field coupling with CS and divergence terms"

[spacetime]
dimension = 3
metric = "minkowski"

[[fields]]
name = "phi"
type = "scalar"

[[fields]]
name = "A"
type = "vector"

[[derived_fields]]
name = "F"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][A[-b]] - CD[-b][A[-a]]"

[constants]
names = ["phim2", "Am2", "kCS", "gSV"]

[lagrangian]
# KG scalar + Maxwell (via derived F) + Proca mass + Chern-Simons + divergence coupling
expression = "-1/2 CD[-a][phi[]] eta[a, b] CD[-b][phi[]] - phim2/2 phi[]^2 - 1/4 F[-a, -b] eta[a, c] eta[b, d] F[-c, -d] - Am2/2 A[-a] eta[a, b] A[-b] + kCS/2 * epsiloneta[a, b, c] * A[-a] * CD[-b][A[-c]] + gSV phi[] eta[a, b] CD[-a][A[-b]]"


[constraint_solver]
enabled = true
method = "auto"
max_iterations = 30
tolerance = 1e-10

[constraint_solver.boundary_conditions.x]
type = "periodic"

[constraint_solver.boundary_conditions.y]
type = "periodic"

[output]
path = "../data/scalar_vector_coupling.json"
