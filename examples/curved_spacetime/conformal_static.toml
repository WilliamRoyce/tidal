[theory]
name = "Conformal Static Klein-Gordon"

[spacetime]
dimension = 2
metric = "diagonal"
# g_ab = Omega^2 * diag(-1, +1) with Omega = 2 (constant conformal factor)
diagonal = [-4, 4]

[[fields]]
name = "phi"
type = "scalar"

[constants]
names = ["m2"]

[lagrangian]
expression = "-1/2 CD[-a][phi[]] eta[a, b] CD[-b][phi[]] - m2/2 phi[]^2"

[output]
path = "examples/data/conformal_kg_static.json"
