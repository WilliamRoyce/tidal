[theory]
name = "Chern-Simons"

[spacetime]
dimension = 3
metric = "minkowski"

[[fields]]
name = "A"
type = "vector"

[constants]
names = ["kappa"]

[lagrangian]
# Maxwell + Chern-Simons topological term (with epsilon tensor)
expression = "-1/2 * (CD[-a][A[-b]] eta[a, c] eta[b, d] CD[-c][A[-d]] - CD[-a][A[-b]] eta[a, d] eta[b, c] CD[-c][A[-d]]) + kappa/2 * epsiloneta[a, b, c] * A[-a] * CD[-b][A[-c]]"

[output]
path = "examples/data/chern_simons_3d.json"
