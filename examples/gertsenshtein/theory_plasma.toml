# Gertsenshtein Effect with Plasma Detuning (Phase F1)
#
# Extends the base Gertsenshtein theory with an effective photon mass from
# plasma frequency: m_gamma = omega_p. This detunes the graviton-photon
# oscillation, suppressing conversion except at MSW-like resonance.
#
# Lagrangian: L = (1/kappa^2) R - (1/4) F_{ab} F^{ab} - (omegaP2/2) a_mu a^mu
#
# The last term is a Proca-type mass for the EM perturbation, representing
# the effective photon mass in a plasma with frequency omega_p:
#   omegaP2 = omega_p^2 (plasma frequency squared)
#
# Detuned conversion probability (Raffelt & Stodolsky 1988, PRD 37:1237):
#   P = (mu/omega_m)^2 * sin^2(omega_m * D)
#   where:
#     mu = kappa * B0 / 2          (coupling strength)
#     Delta = omegaP2 / (2 * omega) (detuning parameter)
#     omega_m = sqrt(Delta^2 + mu^2) (mixing frequency)
#
# At resonance (omegaP2 = 0): recovers P = sin^2(kappa*B0*D/2)
# Off-resonance (Delta >> mu): P ~ (mu/Delta)^2 << 1 (suppressed)
#
# Ref: Raffelt & Stodolsky (1988), PRD 37:1237
#      Dandoy, Lella et al. (2024), arXiv:2406.17853

[theory]
name = "Gertsenshtein Effect with Plasma Detuning"
description = "Graviton-photon conversion in uniform B-field with effective photon mass"

[spacetime]
dimension = 4
metric = "minkowski"

# h: metric perturbation (graviton), symmetric rank-2 tensor
# A: full EM 4-potential (fundamental field for perturbation)
# a: EM perturbation (photon), vector — the dynamical 1st-order variable
[[fields]]
name = "h"
type = "tensor"
rank = 2
symmetry = "symmetric"

[[fields]]
name = "A"
type = "vector"

[[fields]]
name = "a"
type = "vector"

# Electromagnetic field strength tensor F = dA (derived from A)
[[derived_fields]]
name = "F"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][A[-b]] - CD[-b][A[-a]]"

# Background EM 4-potential: Abar_y = -B0*z generates B_x = B0
[[background_fields]]
name = "Abar"
type = "vector"
components = ["0", "0", "-B0 * z[]", "0"]

[constants]
names = ["kappa", "B0", "omegaP2"]

# Full Einstein-Maxwell Lagrangian + plasma mass term
# (1/kappa^2) R - (1/4) F_ab F^ab - (omegaP2/2) a_mu a^mu
#
# The plasma mass term acts only on the EM perturbation a (not the full A),
# representing the effective mass acquired by photon perturbations in a plasma.
# This is physically correct: the background EM field Abar is unaffected by plasma.
[lagrangian]
expression = "(1/kappa^2) RicciScalarCD[] - 1/4 F[-a,-b] eta[a,c] eta[b,d] F[-c,-d] - omegaP2/2 a[-a] eta[a,b] a[-b]"

# Multi-field perturbation:
# - Metric: g = eta + epsilon*h  (via SetupMetricPerturbation)
# - EM: A = Abar + epsilon*a     (via DefTensorPerturbation)
[linearization]
perturbation_field = "h"

[[linearization.matter_perturbations]]
field = "A"
perturbation_name = "a"
background = "Abar"

# TT gauge for graviton
[[gauge]]
field = "h"
type = "tt"

# Lorenz gauge for photon perturbation
[[gauge]]
field = "a"
type = "lorenz"

# Plane-wave reduction: d/dx = d/dy = 0
[reduction]
type = "plane_wave"
propagation_axis = "z"

# Default parameters:
# kappa = 1.0 (natural units)
# B0 = 0.1 (moderate coupling for clear detuning effects)
# omegaP2 = 0.0 (vacuum — recovers base Gertsenshtein)
[parameters]
kappa = 1.0
B0 = 0.1
omegaP2 = 0.0

[output]
path = "../data/gertsenshtein_plasma.json"
