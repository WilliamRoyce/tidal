# Gertsenshtein Effect: Graviton-Photon Conversion in Background Magnetic Field
#
# Lagrangian: L = (1/kappa^2) R - (1/4) F_{ab} F^{ab}
#   (Einstein-Hilbert gravity + Maxwell electrodynamics)
#
# The metric AND EM field are both perturbed:
#   g_{mu,nu} = eta_{mu,nu} + epsilon * h_{mu,nu}   (graviton)
#   A_mu      = Abar_mu     + epsilon * a_mu         (photon)
#
# Background: uniform B-field along x-axis via Abar_y = -B0 * z (Coulomb gauge).
# F_bar_{yz} = d_z(A_y) = -B0, so B_x = B0.
#
# After linearization + TT gauge (h) + Lorenz gauge (a) + plane-wave reduction
# (d/dx = d/dy = 0), the 3+1D tensor+vector system reduces to coupled 1+1D
# equations for h_+ and a_y:
#   d2t(h_+) = d2z(h_+) + coupling * a_y
#   d2t(a_y) = d2z(a_y) + coupling * h_+
#
# The coupling coefficient is proportional to B0, giving the Gertsenshtein effect.
#
# Validation target (Palessandro & Rothman 2023, arXiv:2301.02072, Eq. 26):
#   P(graviton -> photon) = sin^2(kappa * B0 * D / (4*sqrt(pi)))
#
# Ref: Gertsenshtein (1962), JETP 14:84

[theory]
name = "Gertsenshtein Effect (Einstein-Maxwell)"
description = "Graviton-photon conversion in uniform background magnetic field"

[spacetime]
dimension = 4
metric = "minkowski"

# h: metric perturbation (graviton), symmetric rank-2 tensor
# A: full EM 4-potential (fundamental field for perturbation)
# a: EM perturbation (photon), vector — the dynamical 1st-order variable
[[fields]]
name = "h"
type = "tensor"
rank = 2
symmetry = "symmetric"

[[fields]]
name = "A"
type = "vector"

[[fields]]
name = "a"
type = "vector"

# Electromagnetic field strength tensor F = dA (derived from A)
# Expanded via MakeRule BEFORE xPert perturbation
[[derived_fields]]
name = "F"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][A[-b]] - CD[-b][A[-a]]"

# Background EM 4-potential: Abar_y = -B0*z generates B_x = B0
# (Coulomb gauge, uniform magnetic field along x-axis)
[[background_fields]]
name = "Abar"
type = "vector"
components = ["0", "0", "-B0 * z[]", "0"]

[constants]
names = ["kappa", "B0"]

# Full Einstein-Maxwell Lagrangian
# (1/kappa^2) R - (1/4) F_ab F^ab
# where kappa^2 = 16*pi*G in natural units
[lagrangian]
expression = "(1/kappa^2) RicciScalarCD[] - 1/4 F[-a,-b] eta[a,c] eta[b,d] F[-c,-d]"

# Multi-field perturbation:
# - Metric: g = eta + epsilon*h  (via SetupMetricPerturbation)
# - EM: A = Abar + epsilon*a     (via DefTensorPerturbation)
[linearization]
perturbation_field = "h"

[[linearization.matter_perturbations]]
field = "A"
perturbation_name = "a"
background = "Abar"

# Gauge choices follow Palessandro & Rothman (2023) [arXiv:2301.02072], Sec. II:
#
# TT gauge for graviton (transverse-traceless: h_0mu = 0, h^i_i = 0, d^i h_ij = 0)
# Eliminates 6 of 10 metric perturbation components, leaving 2 physical polarizations
# (h_+ and h_x). Standard choice for linearized gravity in flat background.
# Ref: Flanagan & Hughes (2005), §2; Maggiore (2008), §1.3
[[gauge]]
field = "h"
type = "tt"

# Lorenz gauge for photon perturbation (d_mu a^mu = 0)
# Decouples the EM equations into wave equations for each component, enabling
# clean identification of the Gertsenshtein coupling terms. This is the standard
# gauge for the Gertsenshtein effect in the literature:
#   - Palessandro & Rothman (2023) [arXiv:2301.02072], Eq. 9-10
#   - Raffelt & Stodolsky (1988) [PRD 37:1237], Sec. II
#   - Gertsenshtein (1962) [JETP 14:84]
# With both TT + Lorenz gauges, the coupled system reduces to h_+ and a_y only.
[[gauge]]
field = "a"
type = "lorenz"

# Plane-wave reduction: d/dx = d/dy = 0
# Reduces 3+1D to effective 1+1D along z (propagation direction)
[reduction]
type = "plane_wave"
propagation_axis = "z"

# Default parameters:
# kappa = 1.0 (natural units; physical value ~ 1.15e-18 GeV^-1)
# B0 = 0.3 (background magnetic field strength)
[parameters]
kappa = 1.0
B0 = 0.3

[output]
path = "../data/gertsenshtein.json"
