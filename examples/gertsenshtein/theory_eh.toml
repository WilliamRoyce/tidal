# Gertsenshtein Effect + Euler-Heisenberg F^4 Corrections
#
# Lagrangian: L = (1/kappa^2) R - (1/4) F_{ab} F^{ab}
#             + (rho/8) (F_{ab} F^{ab})^2
#             + (sigma/8) (F_{ab} F~^{ab})^2
#
# = Standard Einstein-Maxwell Gertsenshtein (graviton h_ij + photon A_mu)
#   with Euler-Heisenberg QED-effective F^4 corrections.
#
# Both h_ij (graviton) and A_mu (photon) fields are present. The B0
# background drives graviton-photon conversion at O(kappa*B0); the F^4
# terms modify photon propagation in the B0 background.
#
# ndim = 2 (rho, sigma). At the QED effective-field-theory point:
#   sigma/rho = 7/16  (Dunne 2012; Adler 1971)
# The landscape surveys the full (rho, sigma) plane.
#
# Note: examples/data/euler_heisenberg.json has ONLY photon fields and
# CANNOT test Gertsenshtein conversion. This derivation is required for
# the combined EH+Gert survey.
#
# Refs:
#   Gertsenshtein (1962), JETP 14:84
#   Euler & Heisenberg (1936), Ann. Phys. 26:398
#   Adler (1971), Ann. Phys. 67:599
#   Dunne (2012), arXiv:1202.1557

[theory]
name = "Gertsenshtein Effect + Euler-Heisenberg"
description = "Graviton-photon conversion with EH F^4 corrections in uniform background field"

[spacetime]
dimension = 4
metric = "minkowski"

# h: metric perturbation (graviton), symmetric rank-2 tensor
# A: full EM 4-potential (fundamental field for perturbation)
# a: EM perturbation (photon), vector — the dynamical 1st-order variable
[[fields]]
name = "h"
type = "tensor"
rank = 2
symmetry = "symmetric"

[[fields]]
name = "A"
type = "vector"

[[fields]]
name = "a"
type = "vector"

# Electromagnetic field strength tensor F = dA (derived from A)
[[derived_fields]]
name = "F"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][A[-b]] - CD[-b][A[-a]]"

# Background EM 4-potential: Abar_y = -B0*z generates B_x = B0
# (Coulomb gauge, uniform magnetic field along x-axis)
[[background_fields]]
name = "Abar"
type = "vector"
components = ["0", "0", "-B0 * z[]", "0"]

[constants]
names = ["kappa", "B0", "rho", "sigma"]

# Einstein-Maxwell + Euler-Heisenberg F^4 Lagrangian
# (1/kappa^2) R - (1/4) F_ab F^ab + (rho/8)(F_ab F^ab)^2 + (sigma/8)(F_ab F~^ab)^2
# where F~^{ab} = (1/2) epsilon^{abcd} F_{cd}  (dual tensor)
[lagrangian]
expression = "(1/kappa^2) RicciScalarCD[] - 1/4 F[-a,-b] eta[a,c] eta[b,d] F[-c,-d] + rho/8 (F[-a,-b] eta[a,c] eta[b,d] F[-c,-d])^2 + sigma/8 (epsiloneta[a,b,c,d] F[-a,-b] F[-c,-d])^2"

# Multi-field perturbation:
# - Metric: g = eta + epsilon*h  (via SetupMetricPerturbation)
# - EM: A = Abar + epsilon*a     (via DefTensorPerturbation)
[linearization]
perturbation_field = "h"

[[linearization.matter_perturbations]]
field = "A"
perturbation_name = "a"
background = "Abar"

# TT gauge for graviton (transverse-traceless)
[[gauge]]
field = "h"
type = "tt"

# Lorenz gauge for photon perturbation
[[gauge]]
field = "a"
type = "lorenz"

# Plane-wave reduction: d/dx = d/dy = 0
[reduction]
type = "plane_wave"
propagation_axis = "z"

# Default parameters:
# kappa = 1.0, B0 = 0.1, rho = 0.0, sigma = 0.0
# GR limit: rho=sigma=0 -> P_max = sin^2(kappa*B0*t/2) = sin^2(0.05) ~ 0.0025 at t=1

[output]
path = "../data/gertsenshtein_eh.json"
