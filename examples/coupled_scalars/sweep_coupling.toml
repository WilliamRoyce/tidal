# Coupled Scalars — Comprehensive coupling strength investigation
#
# Sweeps gCpl from weak to strong coupling with full measurement suite:
# conversion probability, mixing timescale, asymptotic efficiency,
# effective mass renormalization, and energy conservation.
#
# Physics: Two coupled Klein-Gordon fields (mPhi2=1.0, mChi2=4.0).
# Standing Gaussian wave packet on phi_0. The k-mode spread causes
# decoherence that averages Rabi oscillations into smooth sigmoid
# saturation curves. At strong coupling, normal mode splitting
# modifies dispersion and may cause non-monotonic P_max.
#
# Stability bound: g_crit = sqrt(mPhi2 * mChi2) = 2.0.
# Sweep capped at 1.8 to stay below tachyonic threshold.
#
# Usage:
#   tidal sweep --config examples/coupled_scalars/sweep_coupling.toml
#
# Requires: pre-derived JSON spec at examples/data/coupled_scalars.json
#   (run `tidal derive examples/coupled_scalars/theory.toml` first)

spec = "../data/coupled_scalars.json"

[parameters]
mPhi2 = 1.0
mChi2 = 4.0

[sweep.gCpl]
start = 0.05
stop = 1.8
count = 20
scale = "log"

[simulation]
grid_shape = 128
bounds = [0, 80]
periodic = true
ic = "gaussian"
ic_component = "phi_0"
ic_center = 20.0
ic_width = 3.0
t_end = 60.0

[measurement]
types = ["conversion", "peak_conversion", "mixing", "asymptotic", "effective_mass", "conservation"]
source = "phi_0"
target = "chi_0"

[output]
path = "../data/coupled_scalars_sweep_toml"
