# Gertsenshtein Effective — B0 coupling strength sweep (TOML config)
#
# Sweeps B0 from weak to strong coupling, measuring conversion probability.
# P(t) = sin²(κ*B0*t_end/2) shows Rabi oscillation as a function of B0.
#
# Usage:
#   tidal sweep --config examples/coupled_scalars/sweep_coupling.toml
#
# Ref: Gertsenshtein (1962), Raffelt & Stodolsky (1988)

spec = "../data/coupled_scalars.json"

[parameters]
kappa = 1.0
omegaP2 = 0.0
mg2 = 0.0

[sweep.B0]
start = 0.005
stop = 0.25
count = 20

[simulation]
grid_shape = 256
bounds = [0, 100]
periodic = true
ic = "plane-wave"
ic_component = "h_0"
ic_wavevector = "2.0"
ic_amplitude = 0.1
t_end = 50.0

[measurement]
types = ["conversion", "conservation"]
source = "h_0"
target = "a_0"

[output]
path = "../data/coupled_scalars_sweep_toml"
