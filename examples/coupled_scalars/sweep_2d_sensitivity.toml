# Gertsenshtein Effective — 2D Latin Hypercube Sweep + Sensitivity Analysis
#
# Space-filling sampling (Latin Hypercube) over B0 × omegaP2 parameter plane.
# Demonstrates how conversion efficiency depends on both coupling strength
# and plasma detuning, with Morris sensitivity screening.
#
# Features demonstrated:
#   - F2b: Latin Hypercube sampling (space-filling design)
#   - F4:  Morris sensitivity screening (via `tidal analyze`)
#   - F8:  Advanced visualization (parallel coords, tornado, scatter)
#
# Usage:
#   tidal sweep --config examples/coupled_scalars/sweep_2d_sensitivity.toml
#
# After running, analyze sensitivity:
#   tidal analyze <output_path>/ --sensitivity morris --metric P_max
#
# Ref: Gertsenshtein (1962), Raffelt & Stodolsky (1988)

spec = "../data/coupled_scalars.json"

[parameters]
kappa = 1.0
mg2 = 0.0

[sweep]
strategy = "latin_hypercube"
n_samples = 30

[sweep.B0]
start = 0.01
stop = 0.3

[sweep.omegaP2]
start = 0.0
stop = 2.0

[simulation]
grid_shape = 256
bounds = [0, 100]
periodic = true
ic = "plane-wave"
ic_component = "h_0"
ic_wavevector = "2.0"
ic_amplitude = 0.1
t_end = 50.0

[measurement]
types = ["conversion", "conservation"]
source = "h_0"
target = "a_0"

[output]
path = "../data/coupled_scalars_sensitivity"
