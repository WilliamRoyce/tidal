# Coupled Scalars — 2D Latin Hypercube Sweep + Sensitivity Analysis
#
# Demonstrates space-filling sampling (Latin Hypercube) over the
# coupling strength × target mass parameter plane, followed by
# Morris sensitivity screening and advanced visualization.
#
# Note: Morris screening works with any sampling strategy (grid, LHS, etc.).
# Sobol sensitivity analysis requires Saltelli-structured sampling.
#
# Features demonstrated:
#   - F2b: Latin Hypercube sampling (space-filling design)
#   - F4:  Morris sensitivity screening (via `tidal analyze`)
#   - F8:  Advanced visualization (parallel coords, tornado, scatter)
#
# Usage:
#   tidal sweep --config examples/coupled_scalars/sweep_2d_sensitivity.toml
#
# After running, analyze sensitivity:
#   tidal analyze <output_path>/ --sensitivity morris --metric P_max
#
# Visualization:
#   tidal plot <output_path>/ --type sweep-parallel --metric P_max
#   tidal plot <output_path>/ --type sweep-tornado --metric P_max
#   tidal plot <output_path>/ --type sweep-scatter --metric P_max
#
# Requires: pre-derived JSON spec at examples/data/coupled_scalars.json

spec = "../data/coupled_scalars.json"

[parameters]
mPhi2 = 1.0

[sweep]
strategy = "latin_hypercube"
n_samples = 30

[sweep.gCpl]
start = 0.01
stop = 1.0

[sweep.mChi2]
start = 0.5
stop = 8.0

[simulation]
grid_shape = 64
bounds = [0, 50]
periodic = true
ic = "gaussian"
ic_component = "phi_0"
ic_center = 15.0
ic_width = 3.0
t_end = 10.0

[measurement]
types = ["conversion", "conservation"]
source = "phi_0"
target = "chi_0"

[output]
path = "../data/coupled_scalars_sensitivity"
