# Gertsenshtein Effective — Ensemble Sweep Configuration
#
# TOML config demonstrating ensemble/replicate options with the
# Gertsenshtein effective theory.  Sweeps B0 with IC perturbation
# and parameter noise on omegaP2 for uncertainty quantification.
#
# Usage:
#   tidal sweep --config examples/coupled_scalars/sweep_ensemble.toml
#
# References:
#   Smith, R.C. (2013) Uncertainty Quantification, SIAM. Ch. 3-5.
#   Raffelt & Stodolsky (1988), Phys. Rev. D 37:1237.

spec = "../data/coupled_scalars.json"

[sweep.B0]
start = 0.01
stop = 0.25
count = 8

[measurement]
types = ["conversion", "conservation"]
source = "h_0"
target = "a_0"

[simulation]
grid_shape = 256
bounds = "0:100"
bc = "periodic"
t_end = 50.0
ic = "plane-wave"
ic_amplitude = 0.1
ic_wavevector = "2.0"
ic_component = "h_0"

[parameters]
kappa = 1.0
omegaP2 = 0.0
mg2 = 0.0

# Ensemble settings: N replicates per parameter point
[execution]
n_replicates = 5
base_seed = 42

# Variation sources
[ensemble]
ic_perturbation = 0.02              # 2% Gaussian noise on ICs
param_noise = { omegaP2 = 0.01 }   # omegaP2 ~ N(0.0, 0.01²) per replicate
