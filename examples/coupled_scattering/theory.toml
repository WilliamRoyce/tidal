# Coupled Scalar Scattering — Plane-wave Reduced 1+1D
#
# Physics: Two scalar fields phi and chi coupled through a spatially
# localized background field G(z) = g0 * exp(-z^2 / (2*R^2)).
# The coupling depends ONLY on the propagation axis z, enabling
# plane-wave dimensional reduction from 3+1D to 1+1D.
#
#   L = -1/2 (d phi)^2 - mPhi2/2 phi^2
#       -1/2 (d chi)^2 - mChi2/2 chi^2 - G(z) phi chi
#
# After reduction (d/dx = d/dy = 0), the 1+1D system is:
#   d2t(phi) = d2z(phi) - mPhi2 phi - G(z) chi
#   d2t(chi) = d2z(chi) - mChi2 chi - G(z) phi
#
# Analogy to Gertsenshtein effect:
#   phi  <-> photon           (incident wave)
#   chi  <-> graviton         (generated wave)
#   G(z) <-> background B(z)  (localized coupling region)
#
# The 1+1D reduction gives clean mode conversion without geometric
# spreading or 2D interference patterns that obscure the signal
# in the unreduced 2+1D case.
#
# Demonstrates:
#   - Plane-wave dimensional reduction (3+1D -> 1+1D)
#   - Position-dependent cross-field coupling via [[background_fields]]
#   - Clean parametric mode conversion (Gertsenshtein-effect analogue)
#   - Multi-field energy transfer and conservation

[theory]
name = "Coupled Scalar Scattering (plane-wave reduction)"

[spacetime]
dimension = 4
metric = "minkowski"

[[fields]]
name = "phi"
type = "scalar"

[[fields]]
name = "chi"
type = "scalar"

[constants]
names = ["mPhi2", "mChi2", "g0", "R"]

[[background_fields]]
name = "G"
type = "scalar"
components = ["g0 * Exp[-z[]^2 / (2 * R^2)]"]

[lagrangian]
expression = "-1/2 CD[-a][phi[]] eta[a, b] CD[-b][phi[]] - 1/2 CD[-a][chi[]] eta[a, b] CD[-b][chi[]] - mPhi2/2 * phi[]^2 - mChi2/2 * chi[]^2 - G[] * phi[] * chi[]"

# Stability requirement: all eigenvalues of the pointwise mass matrix must be
# positive.  For this example the condition is mPhi2 * mChi2 > g0^2 (from
# det(M) > 0 at the coupling peak where G = g0).
# With these defaults: det = 1*1 - 0.5^2 = 0.75 > 0.  Minimum stable g0 = sqrt(mPhi2*mChi2) = 1.0.
[parameters]
mPhi2 = 1.0
mChi2 = 1.0
g0 = 0.5
R = 5.0

[reduction]
type = "plane_wave"
propagation_axis = "z"

[output]
path = "../data/coupled_scattering.json"
