# Linearized Massive Gravity in 2+1D — Fierz-Pauli Mass Term
#
# Lagrangian: L = R - (m²/2) [(g-bg)·(g-bg) - (tr(g-bg))²]
#   where bg is a non-dynamical reference metric (= Minkowski).
#
# Linearizes to quadratic order L^(2) via Perturbation[L, 2] / 2:
#   L^(2) ~ R^(2)/2 - (m²/2)(h_ab h^ab - h²)   (Fierz-Pauli mass term)
# Then derives linearized EOM via VarD:
#   G^(1)_ab[h] - m² (h_ab - η_ab h) = 0
#
# Ghost-freedom: Fierz-Pauli propagates 5 DOF (not 6).  Wrong relative
# coefficient between h² and h_ab h^ab activates a Boulware-Deser ghost.
#
# 6 component equations (symmetric rank-2 tensor in 3D).
# In pure 2+1D gravity there are no local degrees of freedom;
# the mass term creates propagating massive modes.
#
# Component structure:
#   h_0 (h_tt): constraint (no d2_t), driven by h_3, h_5
#   h_1, h_2 (h_tx, h_ty): first-order in time
#   h_3, h_4, h_5 (h_xx, h_xy, h_yy): second-order evolution
#
# Dispersion: omega^2 = k^2 + m^2 (massive, subluminal)

[theory]
name = "Massive Gravity"

[spacetime]
dimension = 3
metric = "minkowski"

[[fields]]
name = "h"
type = "tensor"
rank = 2
symmetry = "symmetric"

[constants]
names = ["m2"]

[lagrangian]
expression = "(RicciScalarCD[] - m2/2 * ((eta[-a, -b] - bg[-a, -b]) eta[a, c] eta[b, d] (eta[-c, -d] - bg[-c, -d]) - (eta[a, b] (eta[-a, -b] - bg[-a, -b]))^2))"

[linearization]
perturbation_field = "h"

[parameters]
m2 = 1.0

[constraint_solver]
enabled = true
method = "auto"
max_iterations = 30
tolerance = 1e-10

[constraint_solver.boundary_conditions.x]
type = "periodic"

[constraint_solver.boundary_conditions.y]
type = "periodic"

[output]
path = "../data/massive_gravity_3d.json"
