# Electrostatics: Free Scalar Field in 2+1D
#
# L = -(1/2) (d phi)^2
#
# Euler-Lagrange equation: d2t(phi) = laplacian(phi)
#
# For constraint-mode (Laplace equation), simulate with:
#   tidal simulate ../data/electrostatics_laplace.json --mode constraint

[theory]
name = "Electrostatics"

[spacetime]
dimension = 3
metric = "minkowski"

[[fields]]
name = "phi"
type = "scalar"

[lagrangian]
expression = "-1/2 CD[-a][phi[]] eta[a, b] CD[-b][phi[]]"

[output]
path = "../data/electrostatics_laplace.json"
