# Graviton-Torsion in 2+1D — Fast Test Configuration
#
# 2+1D has fewer torsion components (9 vs 24 in 4D) and faster
# TraceBasisDummy (3^{2K} vs 4^{2K}), making derivation much faster.
#
# NOTE: Standard gravitons don't propagate in 2+1D (Weyl tensor = 0).
# However, torsion modes DO propagate with T² kinetic terms.
# This test verifies the torsion pipeline works correctly before
# attempting the full 4D derivation.
#
# Lagrangian: (1/kappa^2) R̃ + alpha1 T_{abc}T^{abc}
# where R̃ = RicciScalarCDT[] (Riemann-Cartan, auto-decomposed to R + T terms)
# and T = TorsionCDT[a,-b,-c] (explicit torsion squared mass term)

[theory]
name = "Graviton-Torsion 2+1D"

[spacetime]
dimension = 3
metric = "minkowski"

# Torsion: extends the connection to include torsion (PGT).
# Creates TorsionCDT[a,-b,-c] for use in the Lagrangian.
# perturbation_name: the field name used in linearized equations and JSON output.
[torsion]
perturbation_name = "t"

[[fields]]
name = "h"
type = "tensor"
rank = 2
symmetry = "symmetric"

[constants]
names = ["kappa", "alpha1"]

[lagrangian]
expression = "((1/kappa^2) RicciScalarCDT[] + alpha1 TorsionCDT[-a,-b,-c] eta[a,d] eta[b,e] eta[c,f] TorsionCDT[-d,-e,-f])"

[linearization]
perturbation_field = "h"

[reduction]
type = "plane_wave"
propagation_axis = "x"

[parameters]
kappa = 1.0
alpha1 = 0.5

[output]
path = "../data/graviton_torsion_2plus1d.json"
