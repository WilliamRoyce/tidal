# Test theory for IBP validation in canonical Hamiltonian pipeline.
#
# Uses the "box form" Lagrangian L = (1/2) phi * Box(phi) - m2/2 phi^2
# instead of the standard form L = -1/2 (d phi)^2 - m2/2 phi^2.
# These are equivalent via integration by parts (boundary terms vanish).
#
# The box form produces second time derivatives (phi * d^2_t phi) in the
# component Lagrangian, which the IBP step in the canonical pipeline must
# convert to first-order form before the Legendre transform.
#
# Without IBP: H contains phi * d^2_t phi terms -> non-conserved, wrong
# With IBP:    H = (1/2)(d_t phi)^2 + (1/2)(d_x phi)^2 + m2/2 phi^2 -> conserved, correct

[theory]
name = "IBP Test (Box-Form Scalar)"

[spacetime]
dimension = 2
metric = "minkowski"

[[fields]]
name = "phi"
type = "scalar"

[constants]
names = ["m2"]

# Box form: phi * Box(phi) = phi * eta^{ab} d_a d_b phi
# In (-,+) signature: phi * (-d^2_t phi + d^2_x phi)
[lagrangian]
expression = "1/2 phi[] eta[a, b] CD[-a][CD[-b][phi[]]] - m2/2 phi[]^2"


[output]
path = "../data/test_ibp.json"
