# Scalar Field in Localized Potential — Position-Dependent Background
#
# Physics: Same as theory.toml but the potential V is spatially localized
# via UnitStep (Heaviside step function):
#   V(x) = V₀  for 30 ≤ x ≤ 60
#   V(x) = 0   otherwise
#
# This models a finite potential well.  A wave packet approaching from
# outside the well experiences partial reflection at the boundary and
# modified dispersion inside (ω² = k² + V₀).
#
# Demonstrates:
#   - Position-dependent background field components
#   - UnitStep → heaviside conversion in Python coefficient evaluation
#   - coordinate_dependent coefficient handling in the simulation
#
# NOTE: Energy measurement via virial formula does NOT support
# position-dependent mass terms.  The simulation itself works fine,
# but tidal measure --what energy will raise ValueError.

[theory]
name = "Scalar Potential Well"

[spacetime]
dimension = 2
metric = "minkowski"

[[fields]]
name = "phi"
type = "scalar"

[constants]
names = ["V0"]

[[background_fields]]
name = "V"
type = "scalar"
components = ["V0 * UnitStep[x[] - 30] * UnitStep[60 - x[]]"]

[lagrangian]
expression = "-1/2 CD[-a][phi[]] eta[a, b] CD[-b][phi[]] - V[]/2 * phi[]^2"

[parameters]
V0 = 4.0

[output]
path = "../data/scalar_potential_well.json"
