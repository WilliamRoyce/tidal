# Linearized Gravity: Einstein-Hilbert in 3+1D via xPert
#
# Lagrangian: L = R (Ricci scalar of the Einstein-Hilbert action)
# Linearizes to quadratic order L^(2) = Perturbation[R, 2] / 2 via xPert,
# then derives linearized Einstein equations G^(1)_ab[h] = 0 via VarD.
#
# Produces 10 component equations (symmetric rank-2 tensor in 4D).
# Constraint structure: h_00 has no d2_t (Hamiltonian constraint),
# h_0i are first-order (momentum constraints), h_ij are second-order (evolution).

[theory]
name = "Linearized Gravity"

[spacetime]
dimension = 4
metric = "minkowski"

[[fields]]
name = "h"
type = "tensor"
rank = 2
symmetry = "symmetric"

[lagrangian]
expression = "RicciScalarCD[]"

[linearization]
perturbation_field = "h"

[output]
path = "../data/linearized_gravity.json"
