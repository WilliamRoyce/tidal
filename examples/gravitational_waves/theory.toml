# Linearized Gravity: Einstein-Hilbert in 3+1D via xPert + TT Gauge
#
# Lagrangian: L = R (Ricci scalar of the Einstein-Hilbert action)
# Linearizes to quadratic order L^(2) = Perturbation[R, 2] / 2 via xPert,
# then derives linearized Einstein equations G^(1)_ab[h] = 0 via VarD.
#
# TT (transverse-traceless) gauge applied after component decomposition:
# 1. Temporal: h_{0,mu} = 0 (removes lapse + shift perturbations)
# 2. Traceless: h^i_i = 0 (removes spatial trace)
# 3. Transverse: d^i h_{ij} = 0 (removes longitudinal modes)
# Reduces 10 symmetric components to physical polarization modes (h_+, h_x).

[theory]
name = "Linearized Gravity (TT Gauge)"

[spacetime]
dimension = 4
metric = "minkowski"

[[fields]]
name = "h"
type = "tensor"
rank = 2
symmetry = "symmetric"

[lagrangian]
expression = "RicciScalarCD[]"

[linearization]
perturbation_field = "h"

[[gauge]]
field = "h"
type = "tt"

[output]
path = "../data/linearized_gravity.json"
