# Euler-Heisenberg QED Correction + Dual-Gaussian B-field (Phase E.EH)
#
# Combines the existing Euler-Heisenberg Lagrangian
# (-1/4 F^2 + rho/8 (F.F)^2 + sigma/8 (F.F~)^2)
# with the dual-Gaussian B-field background from Phase E.0.
#
# Role in Phase E:
#   Known-physics tunable amplifier channel — distinct from torsion mediation.
#   Provides a cross-check on the atlas methodology using a theory with a
#   verified analytic prediction (Dunne/Adler 7/4 birefringence ratio via
#   sigma/rho = 7/16 mapping; see eh_verification_findings.md memory).
#
# Tunable couplings (sampled in inference):
#   rho   — parity-even (F.F)^2 coupling
#   sigma — parity-odd  (F.F~)^2 coupling
#
# 2D coupling space → smallest atlas in the Phase E roster (4 faces × 1 tile);
# good "methodology shake-down" for the cubed-sphere infrastructure.
#
# Geometry parameters: must match scripts/hpc_submit_drafts/v3e_localised/_geometry.env
#   Bpeak = 0.01, sigB = 5, zc1 = 50, zc2 = 150 (L=200 box)
#
# Refs:
#   Heisenberg & Euler (1936), Z. Phys. 98:714
#   Adler (1971), Ann. Phys. 67:599
#   Dunne (2004), hep-th/0406216 (review §4)

[theory]
name = "Euler-Heisenberg + Dual-Gaussian B (Phase E.EH)"
description = "QED 1-loop quartic photon corrections in a localized dual-Gaussian magnetic field background"

[spacetime]
dimension = 4
metric = "minkowski"

# A: full EM 4-potential (background Abar + perturbation a)
[[fields]]
name = "A"
type = "vector"

# a: photon perturbation — dynamical 1st-order variable
[[fields]]
name = "a"
type = "vector"

# Electromagnetic field strength tensor F = dA
[[derived_fields]]
name = "F"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][A[-b]] - CD[-b][A[-a]]"

# Dual-Gaussian B-field background (validated in Phase E.0).
# B_x(z) = Bpeak * [exp(-(z-zc1)^2/(2*sigB^2)) - exp(-(z-zc2)^2/(2*sigB^2))]
# Abar_y(z) = -Bpeak * sigB * Sqrt[Pi/2]
#             * (Erf[(z-zc1)/(Sqrt[2]*sigB)] - Erf[(z-zc2)/(Sqrt[2]*sigB)])
[[background_fields]]
name = "Abar"
type = "vector"
components = [
  "0",
  "0",
  "-Bpeak * sigB * Sqrt[Pi/2] * (Erf[(z[] - zc1)/(Sqrt[2]*sigB)] - Erf[(z[] - zc2)/(Sqrt[2]*sigB)])",
  "0"
]

[constants]
names = ["Bpeak", "sigB", "zc1", "zc2", "rho", "sigma"]

# Full EH Lagrangian: Maxwell + both 1-loop QED quartic invariants.
# Parenthesized so the multi-line expression parses correctly in wolframscript.
[lagrangian]
expression = "(-1/4 F[-a,-b] eta[a,c] eta[b,d] F[-c,-d] + rho/8 (F[-a,-b] eta[a,c] eta[b,d] F[-c,-d])^2 + sigma/8 (epsiloneta[a,b,c,d] F[-a,-b] F[-c,-d])^2)"

[linearization]
# No metric perturbation (matter-only). SetupMetricPerturbation is called
# internally by xPert but h terms are zeroed.

[[linearization.matter_perturbations]]
field = "A"
perturbation_name = "a"
background = "Abar"

# Lorenz gauge on photon perturbation
[[gauge]]
field = "a"
type = "lorenz"

# Plane-wave reduction along z
[reduction]
type = "plane_wave"
propagation_axis = "z"

# Perturbative scheme: rho and sigma are small EH couplings.
# Pass 0 (rho=sigma=0): standard Maxwell photon propagation in B-field.
# Pass 1 (O(rho, sigma)): EH correction to photon dispersion / eigenfrequencies.
[perturbation]
small_parameters = ["rho", "sigma"]
order = 1

[parameters]
Bpeak = 0.01
sigB = 5.0
zc1 = 50.0
zc2 = 150.0
rho = 0.01
sigma = 0.01

[output]
path = "../data/euler_heisenberg_e_dual_gaussian.json"
