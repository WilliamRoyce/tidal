# Euler-Heisenberg QED Correction to Photon Propagation
#
# Full 1-loop Lagrangian (parity-even + parity-odd sectors):
#
#   L = -1/4 F_{ab} F^{ab}  +  rho/8 * (F_{ab} F^{ab})^2
#                           +  sigma/8 * (eps^{abcd} F_{ab} F_{cd})^2
#
# where rho, sigma are the Euler-Heisenberg couplings (dimension [E]^{-4}).
# The first quartic term is (F.F)^2 (parity-even); the second is (F.F~)^2
# (parity-odd, F~ being the Hodge dual). Both are leading 1-loop QED corrections.
#
# Standard QED 1-loop coefficients (Heisenberg & Euler 1936, Dunne 2004):
#   rho  = 4*alpha^2 / (45 * m_e^4 * pi^2)        [parity-even]
#   sigma = 7*alpha^2 / (90 * m_e^4 * pi^2)       [parity-odd, ratio 7/4 of rho]
#
# Physical content: vacuum birefringence for photon propagating perpendicular
# to a background magnetic field B_0. The famous Adler/Dunne prediction:
#
#   n_parallel  - 1 = (14/45) * alpha^2 * (B_0 / B_crit)^2    [E in plane of B]
#   n_perp      - 1 = ( 8/45) * alpha^2 * (B_0 / B_crit)^2    [E perp plane of B]
#   ratio (n_par^2 - 1) / (n_perp^2 - 1) = 7/4 = 1.75         [dimensionless, alpha-free]
#
#   B_crit = m_e^2 * c^3 / (e * hbar) ~ 4.4e9 T (Schwinger critical field)
#
# Perturbative scheme (v6 architecture):
#   Pass 0 (rho=sigma=0): standard photon EOM -- partial_nu F^{nu mu} = 0
#   Pass 1 (O(rho, sigma)): EH correction to photon dispersion.
#     - (F.F)^2 contributes to both polarizations (2 rho for perp, 6 rho for par).
#     - (F.F~)^2 contributes ONLY to the parallel mode (0 for perp, 8 sigma for par).
#     - Setting (rho, sigma) proportional to (4, 7) recovers the QED 7/4 ratio.
#
# Background: uniform B-field along x-axis via Abar_y = -B0 * z (Coulomb gauge).
# F_bar_{yz} = partial_z(A_y) = -B0, so B_x = B0.
#
# Refs:
#   Heisenberg & Euler (1936), Z. Phys. 98:714 -- original QED effective action
#   Adler (1971), Ann. Phys. 67:599 -- photon splitting / birefringence
#   Dunne (2004), hep-th/0406216 -- review of Euler-Heisenberg, section 4
#
# Note: This theory exercises both the (F.F)^2 decomposition path (#271 fix)
# and the epsilon-tensor path in EvaluateEpsilonComponents. Validation via
# tests/test_euler_heisenberg.py (see plan: full-QED birefringence).
#
# Derivation timing: ~19 s wall for parity-even only (v0.33.9, 2026-04-20);
# expected ~25-35 s with parity-odd (F.F~)^2 added.

[theory]
name = "Euler-Heisenberg QED Correction"
description = "Vacuum birefringence: Maxwell + rho*(F.F)^2 in background B-field"

[spacetime]
dimension = 4
metric = "minkowski"

# A: full EM 4-potential (background Abar + perturbation a)
[[fields]]
name = "A"
type = "vector"

# a: photon perturbation — the dynamical 1st-order variable
[[fields]]
name = "a"
type = "vector"

# Electromagnetic field strength tensor F = dA (derived from the full potential A)
# This is the exact F; xPert splits it into F_bar + delta_F during linearization.
[[derived_fields]]
name = "F"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][A[-b]] - CD[-b][A[-a]]"

# Background EM 4-potential: Abar_y = -B0*z generates B_x = B0
# (Coulomb gauge, uniform magnetic field along x-axis)
[[background_fields]]
name = "Abar"
type = "vector"
components = ["0", "0", "-B0 * z[]", "0"]

[constants]
names = ["B0", "rho", "sigma"]

# Full EH Lagrangian: Maxwell + both 1-loop QED quartic invariants
#
# Parity-even sector: (F.F)^2 with explicit metric contractions
#   F.F = F[-a,-b] eta[a,c] eta[b,d] F[-c,-d]   (= F_{ab} F^{ab})
#
# Parity-odd sector: (F.F~)^2 with Levi-Civita epsilon (dual)
#   F.F~ = epsiloneta[a,b,c,d] F[-a,-b] F[-c,-d]   (= eps^{abcd} F_{ab} F_{cd})
#
# Note: we use epsiloneta (all indices up) to match the Chern-Simons /
# torsion_gertsenshtein parity-odd examples. EvaluateEpsilonComponents
# evaluates eps -> +/-1 components during ComponentDecompose.
#
# Factor conventions: the full Heisenberg-Euler 1-loop effective Lagrangian is
#   L_EH = -F^2/4 + (rho/8)(F.F)^2 + (sigma/8)(F.F~)^2
# with QED values rho = 4 alpha^2/(45 pi^2 m_e^4), sigma = 7 alpha^2/(90 pi^2 m_e^4).
[lagrangian]
expression = "(-1/4 F[-a,-b] eta[a,c] eta[b,d] F[-c,-d] + rho/8 (F[-a,-b] eta[a,c] eta[b,d] F[-c,-d])^2 + sigma/8 (epsiloneta[a,b,c,d] F[-a,-b] F[-c,-d])^2)"

[linearization]
# No perturbation_field: matter-only perturbation (no metric perturbation).
# SetupMetricPerturbation is still called internally (xPert requirement),
# but h terms are zeroed.

[[linearization.matter_perturbations]]
field = "A"
perturbation_name = "a"
background = "Abar"

# Lorenz gauge on photon perturbation: partial^mu a_mu = 0
[[gauge]]
field = "a"
type = "lorenz"

# Plane-wave reduction: propagation along z-axis (partial_x = partial_y = 0)
[reduction]
type = "plane_wave"
propagation_axis = "z"

# Perturbative scheme: rho and sigma are small EH couplings (both parity sectors).
# Pass 0 (rho=sigma=0): standard Maxwell photon propagation in B-field.
# Pass 1 (O(rho, sigma)): EH correction to photon dispersion / eigenfrequencies.
# Perp mode sees only rho; parallel mode sees rho + sigma (birefringence).
[perturbation]
small_parameters = ["rho", "sigma"]
order = 1

[parameters]
B0 = 1.0
rho = 0.01
sigma = 0.01

[output]
path = "../data/euler_heisenberg.json"
