# Dark Photon Torsion: R + Torsion with Non-Minimal Coupling
#
# Lagrangian:
#   L = (1/kappa^2) R + alpha1 I1 + alpha2 I2 + alpha3 I3
#       - 1/4 xi Ftorsion^2 + delta1 Ric_CDT * F - 1/4 F^2
#
# where:
#   R = RicciScalarCD[] (Levi-Civita Ricci scalar, torsion-free)
#   I1 = T_{abc} T^{abc}, I2 = T_{abc} T^{bac}, I3 = T^a_{ab} T^{cb}_{c}
#   Ftorsion = dT (torsion trace field strength)
#   Ric_CDT = RicciCDT (Riemann-Cartan Ricci tensor, includes torsion)
#   F = dA (EM field strength)
#
# KEY DESIGN CHOICES:
#
#   1. R instead of R-tilde: Previous versions used (1/kappa^2) R-tilde
#      (RicciScalarCDT[]), which after ChangeCurvature decomposition
#      gives R + (1/kappa^2) * torsion terms, creating an unavoidable
#      mass floor m_T ~ 1/kappa >> omega_G. Using plain R eliminates
#      these implicit torsion mass contributions, allowing the explicit
#      alpha parameters to set the torsion mass at any desired scale.
#
#   2. delta1 RicciCDT*F coupling: The kinetic mixing F*Ftorsion
#      produces linearized terms proportional to h^a_a (graviton trace),
#      which are killed by TT gauge. The non-minimal RicciCDT*F coupling
#      survives TT gauge because the antisymmetric Ricci is purely
#      torsion-dependent (it vanishes without torsion). After
#      ChangeCurvature, it decomposes into nabla(T)*F cross-terms
#      that produce direct torsion-photon mixing at quadratic level.
#
#   3. Ftorsion^2 kinetic term: Makes the torsion trace propagating
#      (Yang-Mills kinetic structure for the trace vector).
#
# Stability (without R-tilde cross-terms):
#   With R instead of R-tilde, the torsion mass eigenvalues are set
#   entirely by alpha1, alpha2, alpha3. The R-tilde contributions
#   (tensor +1/(2kappa^2), axial +1/(24kappa^2), trace -4/(3kappa^2))
#   are absent. Stability requires all effective mass^2 > 0.
#
# Resonance condition:
#   omega_G = kappa * B0 / 2 (Gertsenshtein frequency)
#   m_T ~ sqrt(|alpha|) (torsion mass from I terms)
#   Resonance when m_T ~ omega_G
#
# Refs:
#   Shapiro (2002), hep-th/0103093 -- non-minimal EM-torsion coupling
#   Barker et al. (2024), arXiv:2406.12826 -- PGT particle spectra
#   research/general_quadratic_lagrangian.tex -- complete enumeration

[theory]
name = "Dark Photon Torsion (R + Non-Minimal Coupling)"
description = "GR + propagating torsion with non-minimal delta1 RicciCDT*F coupling, no R-tilde mass floor"

[spacetime]
dimension = 4
metric = "minkowski"

[torsion]
perturbation_name = "t"

# Metric perturbation h_{ab} (graviton, rank-2 symmetric)
[[fields]]
name = "h"
type = "tensor"
rank = 2
symmetry = "symmetric"

# Full EM 4-potential (fundamental field for perturbation)
[[fields]]
name = "A"
type = "vector"

# EM perturbation (photon)
[[fields]]
name = "a"
type = "vector"

# Electromagnetic field strength tensor F = dA
[[derived_fields]]
name = "F"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][A[-b]] - CD[-b][A[-a]]"

# Torsion trace field strength: Ftorsion_{ab} = d_a T_b - d_b T_a
[[derived_fields]]
name = "Ftorsion"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][TorsionCDT[c,-c,-b]] - CD[-b][TorsionCDT[c,-c,-a]]"

# Background EM 4-potential: Abar_y = -B0*z -> B_x = B0
[[background_fields]]
name = "Abar"
type = "vector"
components = ["0", "0", "-B0 * z[]", "0"]

[constants]
names = ["kappa", "B0", "alpha1", "alpha2", "alpha3", "xi", "delta1"]

# Lagrangian: (1/kappa^2) R + alpha1 I1 + alpha2 I2 + alpha3 I3
#             - 1/4 xi Ftorsion^2 + delta1 RicciCDT*F - 1/4 F^2
#
# Note: ChangeCurvature will decompose RicciCDT -> RicciCD + torsion terms.
# The antisymmetric part of RicciCDT is purely torsion-dependent.
# RicciScalarCD[] passes through unchanged.
[lagrangian]
expression = "((1/kappa^2) RicciScalarCD[] + alpha1 TorsionCDT[-a,-b,-c] eta[a,d] eta[b,e] eta[c,f] TorsionCDT[-d,-e,-f] + alpha2 TorsionCDT[-a,-b,-c] eta[b,d] eta[a,e] eta[c,f] TorsionCDT[-d,-e,-f] + alpha3 TorsionCDT[b,-b,-a] eta[a,d] TorsionCDT[c,-c,-d] - 1/4 xi Ftorsion[-a,-b] eta[a,c] eta[b,d] Ftorsion[-c,-d] + delta1 RicciCDT[-a,-b] eta[a,c] eta[b,d] F[-c,-d] - 1/4 F[-a,-b] eta[a,c] eta[b,d] F[-c,-d])"

[linearization]
perturbation_field = "h"

[[linearization.matter_perturbations]]
field = "A"
perturbation_name = "a"
background = "Abar"

# TT gauge on h -- with plain R, graviton sector is standard GR.
# The delta1 RicciCDT*F coupling involves the antisymmetric Ricci
# (pure torsion), so it survives TT gauge.
[[gauge]]
field = "h"
type = "tt"

# Lorenz gauge on photon a
[[gauge]]
field = "a"
type = "lorenz"

# Plane-wave reduction: propagation along z-axis
[reduction]
type = "plane_wave"
propagation_axis = "z"

# Default parameters:
# kappa = 1.0 (gravitational coupling)
# B0 = 0.01 (background magnetic field, small-P regime)
# alpha1 = -0.01 (I1 mass: tensor sector)
# alpha2 = -0.01 (I2 mass: mixed sector)
# alpha3 = -0.01 (I3 mass: trace sector -- tunable for resonance)
# xi = 1.0 (torsion kinetic strength)
# delta1 = 0.1 (non-minimal RicciCDT*F coupling)

[output]
path = "../data/torsion_dark_photon.json"
