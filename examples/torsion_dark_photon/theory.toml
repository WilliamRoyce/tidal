# Dark Photon Torsion: R + Kinetic Mixing (BSM Dark Photon Model)
#
# Lagrangian:
#   L = (1/kappa^2) R + alpha I3 - 1/4 xi Ftorsion^2
#       + deltam F*Ftorsion - 1/4 F^2
#
# where:
#   R = RicciScalarCD[] (Levi-Civita Ricci scalar, torsion-free)
#   I3 = T^a_{ab} T^{cb}_{c} (torsion trace mass invariant)
#   Ftorsion = dT (torsion trace field strength)
#   F = dA (EM field strength)
#
# This is a pure BSM dark photon model in Einstein-Maxwell theory.
# The torsion trace vector T_mu acts as a dark photon with:
#   - Mass from alpha I3
#   - Yang-Mills kinetic term from xi Ftorsion^2
#   - Kinetic mixing with the photon from deltam F*Ftorsion
#
# KEY DESIGN CHOICES:
#
#   R instead of R-tilde: Previous versions used (1/kappa^2) R-tilde
#   (RicciScalarCDT[]), creating an unavoidable torsion mass floor
#   m_T ~ 1/kappa >> omega_G via ChangeCurvature decomposition.
#   Using plain R eliminates these implicit contributions.
#
#   No TT gauge on h: TT gauge would constrain the coupling structure.
#   Instead, use TT-compatible ICs for physical graviton modes.
#
#   Only I3 (trace sector): The kinetic term Ftorsion^2 only gives
#   dynamics to the trace vector. Including I1, I2 would give mass
#   to tentor/trator without kinetic terms -> ghost instability.
#
# Refs:
#   Barker et al. (2024), arXiv:2406.12826 -- eWGT, dark photon analogy
#   Berlin et al. (2024), arXiv:2405.08865 -- dark photon mixing
#   Nikiforova et al. (2009), arXiv:0905.3732 -- ghost-free massive torsion

[theory]
name = "Dark Photon Torsion (R + Kinetic Mixing + Non-Minimal)"
description = "GR + propagating torsion with kinetic mixing and non-minimal coupling, no R-tilde mass floor"

[spacetime]
dimension = 4
metric = "minkowski"

[torsion]
perturbation_name = "t"

# Metric perturbation h_{ab} (graviton, rank-2 symmetric)
[[fields]]
name = "h"
type = "tensor"
rank = 2
symmetry = "symmetric"

# Full EM 4-potential (fundamental field for perturbation)
[[fields]]
name = "A"
type = "vector"

# EM perturbation (photon)
[[fields]]
name = "a"
type = "vector"

# Electromagnetic field strength tensor F = dA
[[derived_fields]]
name = "F"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][A[-b]] - CD[-b][A[-a]]"

# Torsion trace field strength: Ftorsion_{ab} = d_a T_b - d_b T_a
[[derived_fields]]
name = "Ftorsion"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][TorsionCDT[c,-c,-b]] - CD[-b][TorsionCDT[c,-c,-a]]"

# Background EM 4-potential: Abar_y = -B0*z -> B_x = B0
[[background_fields]]
name = "Abar"
type = "vector"
components = ["0", "0", "-B0 * z[]", "0"]

[constants]
names = ["kappa", "B0", "alpha", "xi", "deltam"]

# Lagrangian: (1/kappa^2) R + alpha I3 - 1/4 xi Ftorsion^2
#             + deltam F*Ftorsion - 1/4 F^2
#
# RicciScalarCD[] — plain Levi-Civita, no torsion mass floor.
# No ChangeCurvature needed — pure Einstein-Maxwell + dark photon.
[lagrangian]
expression = "((1/kappa^2) RicciScalarCD[] + alpha TorsionCDT[b,-b,-a] eta[a,d] TorsionCDT[c,-c,-d] - 1/4 xi Ftorsion[-a,-b] eta[a,c] eta[b,d] Ftorsion[-c,-d] + deltam F[-a,-b] eta[a,c] eta[b,d] Ftorsion[-c,-d] - 1/4 F[-a,-b] eta[a,c] eta[b,d] F[-c,-d])"

[linearization]
perturbation_field = "h"

[[linearization.matter_perturbations]]
field = "A"
perturbation_name = "a"
background = "Abar"

# TT gauge on h — stabilizes graviton sector.
# With the Ftorsion deferral pipeline fix, the direct da·dt kinetic
# mixing survives TT gauge (it doesn't involve h-trace).
[[gauge]]
field = "h"
type = "tt"

# Lorenz gauge on photon a
[[gauge]]
field = "a"
type = "lorenz"

# Plane-wave reduction: propagation along z-axis
[reduction]
type = "plane_wave"
propagation_axis = "z"

# Default parameters:
# kappa = 1.0 (gravitational coupling)
# B0 = 0.01 (background magnetic field, small-P regime)
# alpha = 2.5e-5 (torsion trace mass ~ Gertsenshtein frequency)
# xi = 1.0 (torsion kinetic strength)
# deltam = 0.1 (kinetic mixing F*Ftorsion)

[output]
path = "../data/torsion_dark_photon.json"
