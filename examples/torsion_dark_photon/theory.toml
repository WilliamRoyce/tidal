# Dark Photon Torsion: Graviton-Photon-Torsion Conversion via Kinetic Mixing
#
# Lagrangian:
#   L = (1/κ²) R̃ + α I₃ - ¼ξ Ftorsion² + δ F·Ftorsion - ¼F²
#
# where:
#   R̃ = RicciScalarCDT[] (torsionful Ricci scalar)
#   I₁, I₂, I₃ = torsion quadratic invariants (mass terms)
#   T_μ = T^λ_{λμ} (torsion trace vector)
#   Ftorsion_{μν} = ∂_μ T_ν - ∂_ν T_μ (torsion trace field strength)
#   F_{μν} = ∂_μ A_ν - ∂_ν A_μ (EM field strength)
#
# Physical content:
#   - α I₃: trace-sector torsion mass only (Barker β₃=α, β₁=β₂=0)
#   - -¼ξ Ftorsion²: Yang-Mills-type kinetic term for torsion trace vector
#     → torsion propagates as a massive vector boson (dark photon analogue)
#   - δ F·Ftorsion: kinetic mixing between EM and torsion (dark photon ε)
#     → direct photon ↔ torsion oscillations, no graviton mediator needed
#   - -¼F²: standard Maxwell
#
# Key physics:
#   - NO R̃² → no Ostrogradsky ghosts, well-defined energy, standard GW ICs
#   - The ξ kinetic term makes torsion dynamical (without it, torsion is
#     algebraically constrained by the mass term α)
#   - Three-field mixing system: graviton ↔ photon ↔ torsion
#   - Key question: does torsion-mediated conversion amplify Gertsenshtein?
#     Is there resonance when ω₀ ~ m_torsion?
#
# Ghost/tachyon freedom (in our convention):
#   - ξ > 0 (no kinetic ghost — torsion kinetic energy positive-definite)
#   - α > 0 (no tachyon — positive effective mass²)
#   - |δ|² < f(α, ξ) (kinetic matrix positive-definite)
#
# Convention mapping to Barker et al. (2406.12826):
#   Barker's eWGT action (eq. eWGTAction):
#     S_eWGT = S_PGT + (1/3) ∫ d⁴x √(-g) [χ F_{[μν]} ∂^{[μ}T^{ν]}
#                                             - (ξ/12) ∂_{[μ}T_{ν]} ∂^{[μ}T^{ν]}]
#   Barker uses [μν] = (μν - νμ)/2 convention. Our Ftorsion = 2∂_{[μ}T_{ν]}.
#   Matching: ξ_ours = ξ_Barker/36, δ_ours = χ_Barker/6, α = β₁ = β₂ = β₃
#   Our -¼ξ Ftorsion² convention matches -¼F² (ξ=1 = Maxwell kinetic strength).
#
# Refs:
#   Barker et al. (2024), arXiv:2406.12826 — eWGT completion, propagating
#     vector torsion = Einstein-Proca, dark photon analogy
#   Blagojević & Cvetković (2019), arXiv:1812.02675 — ghost/tachyon-free windows
#   Nikiforova et al. (2009), arXiv:0905.3732 — ghost-free massive torsion
#   Shapiro (2002), hep-th/0103093 — non-minimal EM-torsion coupling enumeration
#   Berlin et al. (2024), arXiv:2405.08865 — dark photon mixing methods

[theory]
name = "Dark Photon Torsion (eWGT Kinetic Mixing)"
description = "PGT + EM with propagating torsion trace via Yang-Mills kinetic term and EM kinetic mixing"

[spacetime]
dimension = 4
metric = "minkowski"

[torsion]
perturbation_name = "t"

# Metric perturbation h_{ab} (graviton, rank-2 symmetric)
[[fields]]
name = "h"
type = "tensor"
rank = 2
symmetry = "symmetric"

# Full EM 4-potential (fundamental field for perturbation)
[[fields]]
name = "A"
type = "vector"

# EM perturbation (photon)
[[fields]]
name = "a"
type = "vector"

# Electromagnetic field strength tensor F = dA
[[derived_fields]]
name = "F"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][A[-b]] - CD[-b][A[-a]]"

# Torsion trace field strength: Ftorsion_{ab} = ∂_a T_b - ∂_b T_a
# where T_c = T^d_{dc} is the torsion trace vector (TorsionCDT[b,-b,-a])
# Analogous to F = dA but for the torsion trace vector instead of A
[[derived_fields]]
name = "Ftorsion"
type = "tensor"
rank = 2
symmetry = "antisymmetric"
definition = "CD[-a][TorsionCDT[c,-c,-b]] - CD[-b][TorsionCDT[c,-c,-a]]"

# Background EM 4-potential: Abar_y = -B0*z → B_x = B0
[[background_fields]]
name = "Abar"
type = "vector"
components = ["0", "0", "-B0 * z[]", "0"]

[constants]
names = ["kappa", "B0", "alpha", "xi", "deltam"]

# Lagrangian: (1/κ²)R̃ + α I₃ - ¼ξ Ftorsion² + δ F·Ftorsion - ¼F²
#
# Terms:
#   1. (1/κ²)R̃ — Einstein-Cartan gravity (torsionful Ricci scalar)
#   2. α I₃ — trace torsion mass: T^a_{ab} T^{cb}_{c} (dark photon mass²)
#      NOTE: Only I₃ (trace sector), NOT I₁+I₂+I₃. The kinetic term ξ Ftorsion²
#      only gives dynamics to the trace vector T_μ. Including I₁,I₂ would give
#      mass to tentor/trator sectors without kinetic terms → ghost instability.
#   3. -¼ξ Ftorsion² — torsion kinetic (Yang-Mills for torsion trace)
#   4. δ F·Ftorsion — EM-torsion kinetic mixing (dark photon ε)
#   5. -¼F² — Maxwell
[lagrangian]
expression = "((1/kappa^2) RicciScalarCDT[] + alpha TorsionCDT[b,-b,-a] eta[a,d] TorsionCDT[c,-c,-d] - 1/4 xi Ftorsion[-a,-b] eta[a,c] eta[b,d] Ftorsion[-c,-d] + deltam F[-a,-b] eta[a,c] eta[b,d] Ftorsion[-c,-d] - 1/4 F[-a,-b] eta[a,c] eta[b,d] F[-c,-d])"

[linearization]
perturbation_field = "h"

[[linearization.matter_perturbations]]
field = "A"
perturbation_name = "a"
background = "Abar"

# NO TT gauge on h — torsion coupling may modify all graviton channels
# Lorenz gauge on photon a only
[[gauge]]
field = "a"
type = "lorenz"

# Plane-wave reduction: propagation along z-axis
[reduction]
type = "plane_wave"
propagation_axis = "z"

# Default parameters
# kappa = 1.0 (gravitational coupling)
# B0 = 0.01 (background magnetic field, small-P regime)
# alpha = 0.5 (unified torsion mass: β₁=β₂=β₃=α)
# xi = 0.1 (torsion kinetic strength; ξ=1 = Maxwell strength)
# deltam = 0.1 (EM-torsion kinetic mixing)
[parameters]
kappa = 1.0
B0 = 0.01
alpha = 0.5
xi = 0.1
deltam = 0.1

[output]
path = "../data/torsion_dark_photon.json"
